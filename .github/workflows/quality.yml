name: Portfolio quality
on:
  workflow_call:
    inputs:
      full_audit:
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 0'
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Classify changes
        id: scope
        env:
          FORCE_RENDER: ${{ inputs.full_audit || false }}
        run: node scripts/change-scope.cjs
      - name: Check release direction
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: test "$HEAD_BRANCH" = develop && test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
      - name: Package public site
        run: npm run package:site
      - name: Validate deployable files
        run: node scripts/check-public.cjs
      - name: Lighthouse mobile and desktop
        if: steps.scope.outputs.render == 'true'
        run: npm run audit:lighthouse
      - name: Browser smoke tests
        if: steps.scope.outputs.render == 'true'
        run: npm run test:browser
      - name: Internal documentation changes
        if: steps.scope.outputs.render != 'true'
        run: echo 'Browser and Lighthouse checks N/A for internal-doc changes or scheduled maintenance; static/security/package checks still ran.' >> "$GITHUB_STEP_SUMMARY"
      - name: Weekly external-link review
        if: github.event_name == 'schedule'
        run: node scripts/external-links.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-reports
          path: dist/reports/
          retention-days: 7
