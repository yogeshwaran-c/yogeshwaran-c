:root{

.code{font-family:var(--display);font-size:clamp(5rem,18vw,12rem);font-weight:900;line-height:1;letter-spacing:-.04em;background:linear-gradient(180deg,var(--text),var(--text3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
.code em{font-style:normal;color:var(--accent);-webkit-text-fill-color:var(--accent)}

.headline{font-family:var(--display);font-size:clamp(1.25rem,3vw,1.75rem);font-weight:700;margin-bottom:1rem;letter-spacing:-.01em}

.subhead{color:var(--text2);margin-bottom:2.5rem;font-size:1rem;line-height:1.7}
.subhead code{font-family:var(--mono);background:var(--bg2);border:1px solid var(--border);padding:2px 8px;border-radius:3px;font-size:.9em;color:var(--accent)}

.actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:12px 22px;border-radius:4px;transition:all .35s cubic-bezier(.175,.885,.32,1.275);display:inline-block;border:1px solid var(--border)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.primary:hover{background:var(--warm);border-color:var(--warm);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,229,200,.2)}
.btn.ghost{color:var(--text2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

footer{position:fixed;bottom:1.5rem;left:0;right:0;text-align:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;z-index:2}
